<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAPTOR MIN FINDER</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fb;--bg3:#f1f3f6;
  --border:#e2e6ed;--border2:#eef0f4;
  --text:#0d1b2a;--text2:#4b5563;--text3:#9ca3af;
  --navy:#0d1b2a;--accent:#1d4ed8;
  --buy1:#15803d;--buy1bg:#dcfce7;--buy1bd:#86efac;
  --buy2:#0369a1;--buy2bg:#e0f2fe;--buy2bd:#7dd3fc;
  --buy3:#92400e;--buy3bg:#fef3c7;--buy3bd:#fcd34d;
  --watch:#6b7280;--watchbg:#f3f4f6;--watchbd:#d1d5db;
  --green:#16a34a;--red:#dc2626;--orange:#d97706;--purple:#7c3aed;
  --shadow:0 1px 3px rgba(13,27,42,.07),0 4px 12px rgba(13,27,42,.04);
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
button{font-family:'Syne',sans-serif;cursor:pointer;border:none;background:none;}

.navbar{background:var(--navy);height:50px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:300;box-shadow:0 2px 12px rgba(0,0,0,.18);}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#dc2626,#d97706);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.brand-name{font-size:13px;font-weight:700;color:#fff;}
.brand-sub{font-size:9px;color:rgba(255,255,255,.35);font-family:'DM Mono',monospace;letter-spacing:1px;}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-meta{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,.4);}
.nav-meta b{color:rgba(255,255,255,.8);}
.live-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:blink 2s infinite;display:inline-block;margin-right:4px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.7);font-size:11px;padding:4px 11px;border-radius:6px;text-decoration:none;font-weight:600;}
.nav-btn:hover{background:rgba(255,255,255,.18);color:#fff;}

.subbar{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.stat-group{display:flex;align-items:baseline;gap:4px;}
.stat-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;line-height:1;}
.stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-family:'DM Mono',monospace;}
.subbar-sep{width:1px;height:28px;background:var(--border);}
.filter-wrap{display:flex;gap:5px;flex-wrap:wrap;}
.filter-btn{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);color:var(--text2);background:var(--bg);cursor:pointer;transition:all .13s;}
.filter-btn:hover{border-color:var(--accent);color:var(--accent);}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.filter-btn.fb1.active{background:var(--buy1);border-color:var(--buy1);}
.filter-btn.fb2.active{background:var(--buy2);border-color:var(--buy2);}
.filter-btn.fb3.active{background:var(--buy3);border-color:var(--buy3);}
.search-wrap{margin-left:auto;position:relative;}
.search-wrap input{background:var(--bg2);border:1.5px solid var(--border);border-radius:7px;padding:6px 12px 6px 30px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);outline:none;width:180px;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap input::placeholder{color:var(--text3);}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px;pointer-events:none;}

.upd-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:5px 24px;display:flex;gap:16px;align-items:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);flex-wrap:wrap;}
.upd-bar b{color:var(--text2);}

.main{padding:12px 24px;max-width:1600px;margin:0 auto;}

.loading{padding:80px;text-align:center;color:var(--text2);font-size:12px;}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}

.list-header{display:grid;grid-template-columns:36px 130px 1fr 72px 72px 90px 140px 96px;gap:0;padding:7px 14px;border-bottom:2px solid var(--border);margin-bottom:3px;}
.lh{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;}
.lh.r{text-align:right;}
.lh.c{text-align:center;}

.etf-row{display:grid;grid-template-columns:36px 130px 1fr 72px 72px 90px 140px 96px;gap:0;align-items:center;padding:9px 14px;border-radius:7px;cursor:pointer;transition:background .1s;margin-bottom:2px;border:1px solid transparent;border-left:3px solid transparent;}
.etf-row:hover{background:var(--bg2);border-color:var(--border);}
.etf-row.buy1{border-left-color:var(--buy1);}
.etf-row.buy2{border-left-color:var(--buy2);}
.etf-row.buy3{border-left-color:var(--buy3);}
.etf-row.watch{border-left-color:var(--border);}

.c-rank{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);}
.c-ticker{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;}
.c-name{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
.c-name small{display:block;font-size:9px;color:var(--text3);margin-top:1px;}
.c-num{font-family:'DM Mono',monospace;font-size:12px;text-align:right;}
.pos{color:var(--green);}
.neg{color:var(--red);}
.neu{color:var(--text3);}

.buy-badge{display:inline-block;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;}
.buy-badge.BUY1{background:var(--buy1bg);color:var(--buy1);border:1px solid var(--buy1bd);}
.buy-badge.BUY2{background:var(--buy2bg);color:var(--buy2);border:1px solid var(--buy2bd);}
.buy-badge.BUY3{background:var(--buy3bg);color:var(--buy3);border:1px solid var(--buy3bd);}
.buy-badge.WATCH{background:var(--watchbg);color:var(--watch);border:1px solid var(--watchbd);}

.score-wrap{display:flex;align-items:center;gap:5px;justify-content:flex-end;}
.score-bar{width:36px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.score-fill{height:100%;border-radius:2px;}
.score-num{font-family:'DM Mono',monospace;font-size:11px;min-width:20px;text-align:right;}

/* Trigger dots */
.tdot{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:'DM Mono',monospace;}
.tdot.on{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.tdot.off{background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb;}
.tdot.pa{background:#ede9fe;color:#7c3aed;border:1px solid #c4b5fd;}

.cat-pills{display:flex;gap:2px;flex-wrap:wrap;}
.cpill{font-size:8px;padding:1px 5px;border-radius:3px;font-family:'DM Mono',monospace;font-weight:600;white-space:nowrap;}
.cp1{background:#fee2e2;color:#991b1b;}
.cp2{background:#e0f2fe;color:#0369a1;}
.cp3{background:#fef3c7;color:#92400e;}
.cp4{background:#dcfce7;color:#15803d;}

.empty-msg{padding:60px;text-align:center;color:var(--text2);font-size:12px;font-family:'DM Mono',monospace;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(13,27,42,.45);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;backdrop-filter:blur(3px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg);border-radius:12px;box-shadow:0 12px 40px rgba(13,27,42,.16);width:100%;max-width:880px;margin:auto;overflow:hidden;animation:slideUp .18s ease;}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hdr{background:var(--navy);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
.modal-ticker{font-family:'DM Mono',monospace;font-size:18px;color:#fff;font-weight:500;}
.modal-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.modal-close{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.1);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.modal-close:hover{background:rgba(255,255,255,.2);}

.modal-signal{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.modal-buy-big{font-family:'DM Mono',monospace;font-size:24px;font-weight:700;min-width:70px;}
.modal-buy-big.BUY1{color:var(--buy1);}
.modal-buy-big.BUY2{color:var(--buy2);}
.modal-buy-big.BUY3{color:var(--buy3);}
.modal-buy-big.WATCH{color:var(--watch);}
.modal-reason{font-size:12px;color:var(--text2);line-height:1.8;flex:1;}
.modal-reason strong{color:var(--text);}

/* Trigger panel 4 colonne */
.trigger-panel{padding:12px 18px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.trig-card{border-radius:8px;padding:9px 11px;border:1.5px solid;}
.trig-card.tc-on{background:#dcfce7;border-color:#86efac;}
.trig-card.tc-off{background:#f9fafb;border-color:#e5e7eb;}
.trig-card.tc-pa-on{background:#ede9fe;border-color:#c4b5fd;}
.trig-card.tc-pa-off{background:#f9fafb;border-color:#e5e7eb;}
.trig-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
.trig-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:700;}
.trig-val.ok{color:#15803d;}
.trig-val.no{color:#9ca3af;}
.trig-val.pa{color:#7c3aed;}
.trig-sub{font-size:10px;color:var(--text2);margin-top:2px;}

.modal-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.kpi{background:var(--bg);padding:8px 11px;}
.kpi-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;}
.kpi-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;}
.kpi-val.pos{color:var(--green);}
.kpi-val.neg{color:var(--red);}
.kpi-val.warn{color:var(--orange);}

.modal-chart{padding:13px 18px;}
.chart-tabs{display:flex;gap:5px;margin-bottom:9px;}
.chart-tab{font-family:'DM Mono',monospace;font-size:10px;padding:4px 10px;border-radius:5px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .12s;}
.chart-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.chart-container{position:relative;height:250px;}

@media(max-width:900px){
  .list-header,.etf-row{grid-template-columns:28px 110px 1fr 64px 64px 80px;}
  .col-score,.col-cat{display:none;}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="brand">
    <div class="brand-icon">MF</div>
    <div>
      <div class="brand-name">RAPTOR MIN FINDER</div>
      <div class="brand-sub">MINIMI + INVERSIONE · v4.0</div>
    </div>
  </div>
  <div class="nav-right">
    <div style="font-size:10px;color:rgba(255,255,255,.45);font-family:'DM Mono',monospace">
      <span class="live-dot" id="liveDot"></span><span id="statusTxt">CARICAMENTO</span>
    </div>
    <div class="nav-meta">AGG: <b id="lastUpd">—</b></div>
    <a href="https://giorgiogoldoni.github.io/trader/" class="nav-btn">← Hub</a>
  </div>
</nav>

<div class="subbar" id="subbar" style="display:none">
  <div class="stat-group"><div class="stat-val" id="s-total" style="color:var(--accent)">—</div><div class="stat-lbl">candidati</div></div>
  <div class="subbar-sep"></div>
  <div class="stat-group"><div class="stat-val" id="s-b1" style="color:var(--buy1)">—</div><div class="stat-lbl">BUY1</div></div>
  <div class="stat-group"><div class="stat-val" id="s-b2" style="color:var(--buy2)">—</div><div class="stat-lbl">BUY2</div></div>
  <div class="stat-group"><div class="stat-val" id="s-b3" style="color:var(--buy3)">—</div><div class="stat-lbl">BUY3</div></div>
  <div class="subbar-sep"></div>
  <div class="stat-group"><div class="stat-val" id="s-universe">—</div><div class="stat-lbl">universe</div></div>
  <div class="stat-group"><div class="stat-val" id="s-analyzed">—</div><div class="stat-lbl">analizzati</div></div>
  <div class="subbar-sep"></div>
  <div class="filter-wrap">
    <button class="filter-btn active" onclick="setFilter('ALL',this)">TUTTI</button>
    <button class="filter-btn fb1" onclick="setFilter('BUY1',this)">BUY1</button>
    <button class="filter-btn fb2" onclick="setFilter('BUY2',this)">BUY2</button>
    <button class="filter-btn fb3" onclick="setFilter('BUY3',this)">BUY3</button>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Cerca ticker..." oninput="renderList()">
  </div>
</div>

<div class="upd-bar" id="updBar" style="display:none"></div>

<div class="main">
  <div id="loadingEl" class="loading"><div class="spinner"></div>Caricamento candidati...</div>
  <div id="emptyEl" class="empty-msg" style="display:none">Nessun candidato — esegui il workflow GitHub Actions</div>

  <div class="list-header" id="listHeader" style="display:none">
    <div class="lh">#</div>
    <div class="lh">TICKER</div>
    <div class="lh">NOME</div>
    <div class="lh r">PREZZO</div>
    <div class="lh r">1D%</div>
    <div class="lh r col-score">SCORE</div>
    <div class="lh c">K · A · O · PA</div>
    <div class="lh c col-cat">ZONA</div>
  </div>

  <div id="listEl"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-hdr">
      <div><div class="modal-ticker" id="m-ticker">—</div><div class="modal-sub" id="m-sub">—</div></div>
      <div class="modal-close" onclick="closeModalDirect()">✕</div>
    </div>
    <div class="modal-signal">
      <div class="modal-buy-big" id="m-buy">—</div>
      <div class="modal-reason" id="m-reason">—</div>
    </div>
    <div class="trigger-panel" id="m-triggers"></div>
    <div class="modal-kpis" id="m-kpis"></div>
    <div class="modal-chart">
      <div class="chart-tabs">
        <button class="chart-tab active" onclick="setChart('price',this)">Prezzo + KAMA</button>
        <button class="chart-tab" onclick="setChart('obv',this)">OBV</button>
        <button class="chart-tab" onclick="setChart('bb',this)">Bollinger</button>
      </div>
      <div class="chart-container"><canvas id="mainChart"></canvas></div>
    </div>
  </div>
</div>

<script>
let DATA=null, allCandidates=[], activeFilter='ALL';
let modalETF=null, chartInst=null, chartMode='price';

async function load(){
  const urls=['data/min_finder_live.json?t='+Date.now(),'data/min_finder.json?t='+Date.now()];
  for(const url of urls){
    try{const r=await fetch(url);if(!r.ok)continue;DATA=await r.json();break;}catch(e){continue;}
  }
  if(!DATA){
    document.getElementById('loadingEl').style.display='none';
    document.getElementById('emptyEl').style.display='block';
    document.getElementById('liveDot').style.background='#dc2626';
    document.getElementById('statusTxt').textContent='OFFLINE';
    return;
  }
  document.getElementById('liveDot').style.background='#22c55e';
  document.getElementById('statusTxt').textContent='LIVE';
  const gen=new Date(DATA.generated||DATA.base_generated||'');
  document.getElementById('lastUpd').textContent=isNaN(gen)?'—':gen.toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

  buildCandidates();

  document.getElementById('s-total').textContent=allCandidates.length;
  document.getElementById('s-b1').textContent=allCandidates.filter(e=>e.buy_level==='BUY1').length;
  document.getElementById('s-b2').textContent=allCandidates.filter(e=>e.buy_level==='BUY2').length;
  document.getElementById('s-b3').textContent=allCandidates.filter(e=>e.buy_level==='BUY3').length;
  document.getElementById('s-universe').textContent=DATA.universe_tot||'—';
  document.getElementById('s-analyzed').textContent=DATA.analyzed||'—';

  const bg=DATA.base_generated?new Date(DATA.base_generated).toLocaleString('it-IT'):'—';
  document.getElementById('updBar').innerHTML=
    `<span>Scansione: <b>${bg}</b></span>`+
    `<span>Live aggiornati: <b>${DATA.live_updated||0}</b></span>`+
    `<span>Universe: <b>${DATA.universe_tot||0}</b></span>`+
    `<span>Candidati con trigger: <b>${allCandidates.length}</b></span>`;

  document.getElementById('loadingEl').style.display='none';
  ['subbar','updBar','listHeader'].forEach(id=>document.getElementById(id).style.display='');
  renderList();
}

function buildCandidates(){
  const lists=[
    ...(DATA.top20||[]),...(DATA.lista1_min_storico||[]),...(DATA.lista2_pullback||[]),
    ...(DATA.lista3_compressione||[]),...(DATA.lista4_min_relativo||[]),...(DATA.lista_master||[]),
  ];
  const seen=new Map();
  for(const e of lists){
    if(!e||!e.ticker)continue;
    if(!seen.has(e.ticker)) seen.set(e.ticker,e);
    else if((e.composite_score||0)>(seen.get(e.ticker).composite_score||0)) seen.set(e.ticker,e);
  }
  allCandidates=[...seen.values()]
    .filter(e=>e.buy_level!=='WATCH')
    .sort((a,b)=>(b.composite_score||0)-(a.composite_score||0));
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList(){
  const search=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const filtered=allCandidates.filter(e=>{
    if(activeFilter!=='ALL'&&e.buy_level!==activeFilter)return false;
    if(search){
      const t=(e.ticker||'').toLowerCase(),n=(e.name||'').toLowerCase();
      if(!t.includes(search)&&!n.includes(search))return false;
    }
    return true;
  });
  const el=document.getElementById('listEl');
  if(!filtered.length){el.innerHTML='<div class="empty-msg">Nessun ETF corrisponde ai filtri</div>';return;}
  el.innerHTML=filtered.map((e,i)=>rowHTML(e,i+1)).join('');
}

function rowHTML(e,rank){
  const lvl=(e.buy_level||'WATCH').toUpperCase();
  const r1d=e.ret_1d;
  const chgC=r1d==null?'neu':r1d>0?'pos':r1d<0?'neg':'neu';
  const chgS=r1d==null?'—':(r1d>0?'+':'')+r1d.toFixed(2)+'%';
  const price=e.price!=null?e.price.toFixed(2):'—';
  const sc=e.composite_score||0;
  const inv=e.inversion_score||0;
  const scC=sc>=70?'#15803d':sc>=40?'#0369a1':'#6b7280';
  const tK=e.kama_cross?'on':'off';
  const tA=e.atr_rising?'on':'off';
  const tO=e.obv_divergence?'on':'off';
  const tPA=e.price_action_3up?'pa':'off';
  const cats=[];
  if(e.is_min_storico) cats.push('<span class="cpill cp1">📉S</span>');
  if(e.is_pullback)    cats.push('<span class="cpill cp2">🔄P</span>');
  if(e.is_compressione)cats.push('<span class="cpill cp3">🔥C</span>');
  if(e.is_min_relativo)cats.push('<span class="cpill cp4">📊R</span>');
  return `<div class="etf-row ${lvl.toLowerCase()}" onclick="openModal('${e.ticker}')">
    <div class="c-rank">${rank}</div>
    <div>
      <div class="c-ticker">${e.ticker}</div>
      <div style="margin-top:3px"><span class="buy-badge ${lvl}">${lvl}</span></div>
    </div>
    <div class="c-name">${e.name||e.ticker}<small>${e.borsa||''} · ${(e.categoria||'').substring(0,16)}</small></div>
    <div class="c-num">${price}</div>
    <div class="c-num ${chgC}">${chgS}</div>
    <div class="col-score">
      <div class="score-wrap">
        <div class="score-bar"><div class="score-fill" style="width:${Math.min(100,sc)}%;background:${scC}"></div></div>
        <div class="score-num" style="color:${scC}">${sc}</div>
      </div>
      <div style="text-align:right;font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);margin-top:1px">inv:${inv}</div>
    </div>
    <div style="display:flex;gap:3px;align-items:center;justify-content:center">
      <span class="tdot ${tK}" title="KAMA cross">K</span>
      <span class="tdot ${tA}" title="ATR rising">A</span>
      <span class="tdot ${tO}" title="OBV divergenza">O</span>
      <span class="tdot ${tPA}" title="Price action 3↑">PA</span>
    </div>
    <div class="col-cat"><div class="cat-pills">${cats.join('')}</div></div>
  </div>`;
}

function buildReason(e){
  const lvl=e.buy_level||'WATCH';
  const parts=[];
  if(lvl==='BUY1') parts.push('<strong>3 trigger attivi:</strong> il segnale di inversione è completo.');
  else if(lvl==='BUY2') parts.push('<strong>2 trigger su 3:</strong> segnale in costruzione — size ridotta.');
  else if(lvl==='BUY3') parts.push('<strong>1 trigger attivo:</strong> monitora, entra solo se domani BUY2.');
  const cats=[];
  if(e.is_min_storico)  cats.push('vicino al <strong>minimo storico 52W</strong>');
  if(e.is_pullback)     cats.push('in <strong>pullback su trend rialzista</strong>');
  if(e.is_compressione) cats.push('<strong>volatilità compressa</strong>');
  if(e.is_min_relativo) cats.push('<strong>minimo relativo</strong> vs settore');
  if(cats.length) parts.push('ETF '+cats.join(' + ')+'.');
  if(e.price_action_3up) parts.push('Price action: <strong>3 chiusure consecutive crescenti</strong> — conferma visiva.');
  return parts.join(' ');
}

function openModal(ticker){
  const allSrc=[
    ...(DATA.top20||[]),...(DATA.lista1_min_storico||[]),...(DATA.lista2_pullback||[]),
    ...(DATA.lista3_compressione||[]),...(DATA.lista4_min_relativo||[]),...(DATA.lista_master||[]),
  ];
  let etf=allSrc.find(e=>e&&e.ticker===ticker)||{ticker,name:ticker};
  const charts=DATA.charts||{};
  if(charts[ticker]) etf={...etf,chart:charts[ticker]};
  modalETF=etf;

  document.getElementById('m-ticker').textContent=ticker;
  document.getElementById('m-sub').textContent=(etf.name||ticker)+' · '+(etf.borsa||'')+' · '+(etf.categoria||'');

  const lvl=etf.buy_level||'WATCH';
  const buyEl=document.getElementById('m-buy');
  buyEl.textContent=lvl; buyEl.className='modal-buy-big '+lvl;
  document.getElementById('m-reason').innerHTML=buildReason(etf);

  // Trigger panel
  document.getElementById('m-triggers').innerHTML=[
    {
      lbl:'① KAMA Cross',
      cls:etf.kama_cross?'tc-on':'tc-off',
      val:etf.kama_cross?`▲ ${etf.kama_cross_bars?etf.kama_cross_bars+'B fa':'recente'}`:'— Non ancora',
      vc:etf.kama_cross?'ok':'no',
      sub:etf.kama_cross?'Prezzo ha tagliato KAMA dal basso':'Prezzo ancora sotto KAMA',
    },
    {
      lbl:'② ATR Rising',
      cls:etf.atr_rising?'tc-on':'tc-off',
      val:etf.atr_rising?'▲ In crescita':'— Piatto/scende',
      vc:etf.atr_rising?'ok':'no',
      sub:etf.atr_rising?'ATR sale col prezzo — energia rialzista':'ATR non conferma il rimbalzo',
    },
    {
      lbl:'③ OBV Divergenza',
      cls:etf.obv_divergence?'tc-on':'tc-off',
      val:etf.obv_divergence?'↑ Bullish':'— Assente',
      vc:etf.obv_divergence?'ok':'no',
      sub:etf.obv_divergence?'Prezzo scende, OBV tiene — accumulo':'Nessuna divergenza OBV',
    },
    {
      lbl:'PA Complementare',
      cls:etf.price_action_3up?'tc-pa-on':'tc-pa-off',
      val:etf.price_action_3up?'✓ 3 chiusure ↑':'— Non conferma',
      vc:etf.price_action_3up?'pa':'no',
      sub:etf.price_action_3up?'3 close consecutive crescenti':'Price action non allineata',
    },
  ].map(t=>`<div class="trig-card ${t.cls}">
    <div class="trig-label">${t.lbl}</div>
    <div class="trig-val ${t.vc}">${t.val}</div>
    <div class="trig-sub">${t.sub}</div>
  </div>`).join('');

  // KPI
  const r1d=etf.ret_1d,r3m=etf.ret_3m;
  document.getElementById('m-kpis').innerHTML=[
    {l:'Prezzo',    v:etf.price!=null?etf.price.toFixed(4):'—',c:''},
    {l:'1D%',       v:r1d!=null?(r1d>0?'+':'')+r1d.toFixed(2)+'%':'—',c:r1d>0?'pos':r1d<0?'neg':''},
    {l:'3M%',       v:r3m!=null?(r3m>0?'+':'')+r3m.toFixed(1)+'%':'—',c:r3m>0?'pos':r3m<0?'neg':''},
    {l:'Inv.Score', v:etf.inversion_score||'—',c:(etf.inversion_score||0)>=70?'pos':(etf.inversion_score||0)>=40?'warn':''},
    {l:'Comp.Score',v:etf.composite_score||'—',c:''},
    {l:'Trigger',   v:(etf.trigger_count||0)+'/3',c:(etf.trigger_count||0)>=2?'pos':''},
    {l:'52W Low',   v:etf.low_52w?etf.low_52w.toFixed(2):'—',c:''},
    {l:'Dist Low',  v:etf.dist_52w_low!=null?etf.dist_52w_low.toFixed(1)+'%':'—',c:(etf.dist_52w_low||99)<10?'warn':''},
    {l:'KAMA',      v:etf.kama?etf.kama.toFixed(4):'—',c:etf.price_above_kama?'pos':'neg'},
    {l:'ATR',       v:etf.atr?etf.atr.toFixed(4):'—',c:''},
    {l:'SAR',       v:etf.sar_bull!=null?(etf.sar_bull?'Bull':'Bear'):'—',c:etf.sar_bull?'pos':'neg'},
    {l:'N.Cat',     v:etf.n_categorie||'—',c:''},
  ].map(k=>`<div class="kpi"><div class="kpi-lbl">${k.l}</div><div class="kpi-val ${k.c}">${k.v}</div></div>`).join('');

  chartMode='price';
  document.querySelectorAll('.chart-tab').forEach((t,i)=>t.classList.toggle('active',i===0));
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(renderChart,50);
}

function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalDirect();}
function closeModalDirect(){
  document.getElementById('modalOverlay').classList.remove('open');
  if(chartInst){chartInst.destroy();chartInst=null;}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect();});

function setChart(mode,btn){
  chartMode=mode;
  document.querySelectorAll('.chart-tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(chartInst){chartInst.destroy();chartInst=null;}
  renderChart();
}

function renderChart(){
  if(!modalETF?.chart)return;
  const ctx=document.getElementById('mainChart').getContext('2d');
  if(chartInst){chartInst.destroy();chartInst=null;}
  const c=modalETF.chart;
  const labels=c.dates||[],closes=c.closes||[];
  const baseOpts={
    responsive:true,maintainAspectRatio:false,
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{display:true,labels:{font:{family:'DM Mono',size:9},color:'#6b7280',boxWidth:12,padding:8}},
      tooltip:{backgroundColor:'#0d1b2a',titleFont:{family:'DM Mono',size:9},bodyFont:{family:'DM Mono',size:9},
        callbacks:{label:ctx2=>ctx2.parsed.y==null?null:' '+ctx2.dataset.label+': '+ctx2.parsed.y.toFixed(4)}},
    },
    scales:{
      x:{ticks:{font:{family:'DM Mono',size:8},color:'#9ca3af',maxTicksLimit:8,maxRotation:0},grid:{color:'rgba(0,0,0,.04)'}},
      y:{position:'right',ticks:{font:{family:'DM Mono',size:8},color:'#9ca3af'},grid:{color:'rgba(0,0,0,.04)'}},
    },
  };
  if(chartMode==='price'){
    const sarColors=(c.sar_bull||[]).map(b=>b?'rgba(22,163,74,.7)':'rgba(220,38,38,.7)');
    const bgPlugin={id:'bg',beforeDraw(chart){
      const{ctx:x,chartArea:a,scales:sc}=chart;if(!a)return;
      (c.sar_bull||[]).forEach((b,i)=>{
        const x0=sc.x.getPixelForValue(i),x1=sc.x.getPixelForValue(i+1);
        x.fillStyle=b?'rgba(22,163,74,.03)':'rgba(220,38,38,.03)';
        x.fillRect(x0,a.top,x1-x0,a.height);
      });
    }};
    chartInst=new Chart(ctx,{type:'line',plugins:[bgPlugin],data:{labels,datasets:[
      {label:'Prezzo',data:closes,borderColor:'#0d1b2a',borderWidth:1.5,pointRadius:0,tension:.1,fill:false},
      {label:'KAMA',  data:c.kama, borderColor:'#1d4ed8',borderWidth:2,  pointRadius:0,tension:.2,fill:false},
      {label:'MA50',  data:c.ma50, borderColor:'#d97706',borderWidth:1,  pointRadius:0,fill:false,borderDash:[4,3]},
      {label:'MA200', data:c.ma200,borderColor:'#dc2626',borderWidth:1.5,pointRadius:0,fill:false,borderDash:[6,2]},
      {label:'SAR',data:c.sar,borderColor:'transparent',pointRadius:3,pointStyle:'circle',pointBackgroundColor:sarColors,showLine:false},
    ]},options:baseOpts});
  } else if(chartMode==='obv'){
    chartInst=new Chart(ctx,{type:'line',data:{labels,datasets:[
      {label:'OBV',data:c.obv,borderColor:'#7c3aed',borderWidth:1.5,pointRadius:0,fill:false,tension:.1},
    ]},options:baseOpts});
  } else if(chartMode==='bb'){
    chartInst=new Chart(ctx,{type:'line',data:{labels,datasets:[
      {label:'Prezzo',  data:closes,    borderColor:'#0d1b2a',borderWidth:1.5,pointRadius:0,tension:.1,fill:false},
      {label:'BB Upper',data:c.bb_upper,borderColor:'rgba(107,114,128,.5)',borderWidth:1,pointRadius:0,fill:'+1',backgroundColor:'rgba(107,114,128,.07)',borderDash:[3,3]},
      {label:'BB Lower',data:c.bb_lower,borderColor:'rgba(107,114,128,.5)',borderWidth:1,pointRadius:0,fill:false,borderDash:[3,3]},
      {label:'BB Mid',  data:c.bb_mid,  borderColor:'rgba(107,114,128,.3)',borderWidth:1,pointRadius:0,fill:false},
    ]},options:baseOpts});
  }
}

load();
setInterval(load,10*60*1000);
</script>
</body>
</html>
